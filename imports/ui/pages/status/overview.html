<template name="statusOverview">
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
      {{#each app in apps}}
          {{#if isConnected app}}
            <div class="col">
              <div class="card h-100">
                <div class="card-body">
                  <a href="{{route 'statusApp' app.id}}">
                    <h2 class="text-secondary d-flex justify-content-between">
                      <span>{{app.name}}</span>
                        {{> icon fw=true name=app.icon}}
                    </h2>
                  </a>
                  <small>
                    <a href="{{app.url}}" target="_blank">
                        {{> icon fw=true name="external-link-alt"}}
                        {{app.url}}
                    </a>
                  </small>
                </div>
                <div class="card-body">
                    {{!-- connection --}}
                  <div class="d-flex justify-content-between py-1">
                    <span>
                        {{> icon fw=true name="plug"}}
                      <span>{{i18n "pages.status.connection"}}</span>
                    </span>
                      {{> icon fw=true name="check" class="text-success"}}
                  </div>
                    {{!-- authenticated --}}
                  <div class="d-flex justify-content-between py-1">
                    <span>
                        {{> icon fw=true name="lock"}}
                      <span>{{i18n "pages.status.loggedIn"}}</span>
                    </span>
                      {{#if isLoggedIn app}}
                          {{> icon fw=true name="check" class="text-success"}}
                      {{else}}
                          {{> icon fw=true name="times" class="text-danger"}}
                      {{/if}}
                  </div>
                  <div class="d-flex justify-content-between py-1">
                      <span>
                        {{> icon fw=true name="heartbeat"}}
                        <span>{{i18n "pages.status.health"}}</span>
                      </span>
                      {{#if app.health.status}}
                          {{#if app.health.status.ok}}
                              {{> icon fw=true name="check" class="text-success"}}
                          {{else}}
                              {{> icon fw=true name="times" class="text-danger"}}
                          {{/if}}
                      {{else}}
                          {{> loading}}
                      {{/if}}
                  </div>
                    {{#if app.health.status}}
                        {{#if app.health.status.ok}}
                          ...
                        {{else}}
                          <div class="alert alert-danger mt-3" role="alert">
                              {{#if app.health.status.reason}}
                                  {{app.health.status.reason}}
                              {{else}}
                                  {{i18n "pages.status.noHealthInfo"}}
                              {{/if}}
                          </div>
                            {{> stringified app.halth}}
                        {{/if}}
                    {{/if}}
                </div>
              </div>
            </div>
          {{/if}}
      {{else}}
        <span>
                <i class="fa fas fa-fw fa-spinner fa-pulse"></i>
            </span>
      {{/each}}
  </div>
</template>
